<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>French Listening Lab | Executive Class</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#23272c; --navy-2:#2e333a; --navy-3:#3c424a; --chalk:#e8eaec; --dim:#a3aab2;
  --paper:#f5f5f3; --white:#fff; --ink:#1e2226; --muted:#5b6168; --rule:#dcdfe2;
  --gold:#4e9c93; --gold-soft:#e2f1ef;
  --missed:#f7dca4; --missed-ink:#6a4300; --extra:#b3261e;
  --p1:#2f6f69; --p2:#7a3b2e; --p3:#2f4f86; --p4:#3d6b3a; --p5:#9a5a12; --p6:#8a3b5a; --p7:#5f5a1c;
  --p8:#4b3f8f; --p9:#1f5e7a; --p10:#6b2d5c; --p11:#384a62; --p12:#8a4b12; --p13:#2d6a4f;
  --part:var(--p1);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-part="1"]{--part:var(--p1)} [data-part="2"]{--part:var(--p2)} [data-part="3"]{--part:var(--p3)}
[data-part="4"]{--part:var(--p4)} [data-part="5"]{--part:var(--p5)} [data-part="6"]{--part:var(--p6)}
[data-part="7"]{--part:var(--p7)} [data-part="8"]{--part:var(--p8)} [data-part="9"]{--part:var(--p9)}
[data-part="10"]{--part:var(--p10)} [data-part="11"]{--part:var(--p11)} [data-part="12"]{--part:var(--p12)} [data-part="13"]{--part:var(--p13)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.55;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--part)}

.shell{display:grid;grid-template-columns:330px 1fr;min-height:100vh}
aside{background:var(--navy);color:var(--chalk);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.brand{padding:26px 24px 20px;border-bottom:1px solid var(--navy-3);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.crest{width:46px;height:46px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--gold);font-size:17px;letter-spacing:.02em}
.brand h1{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.1;color:var(--white)}
.brand p{font-size:13px;color:var(--dim);margin-top:3px}
.search{padding:14px 24px;border-bottom:1px solid var(--navy-3)}
.search input{width:100%;background:var(--navy-2);border:1px solid var(--navy-3);border-radius:8px;padding:9px 12px;color:var(--white)}
.search input::placeholder{color:#8794ad}
.progress-mini{padding:12px 24px;border-bottom:1px solid var(--navy-3);font-size:13px;color:var(--dim)}
.progress-mini .bar{height:5px;background:var(--navy-3);border-radius:3px;margin-top:6px;overflow:hidden}
.progress-mini .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
nav{overflow-y:auto;flex:1;padding:6px 0 24px}
.home-link{display:block;width:100%;text-align:left;background:none;border:0;color:var(--chalk);padding:12px 24px 8px;cursor:pointer;font-size:14.5px;font-weight:600}
.home-link:hover{color:var(--gold)}
details.part{margin-top:2px}
details.part summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;align-items:baseline;gap:8px;padding:9px 24px;font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--white)}
details.part summary::-webkit-details-marker{display:none}
details.part summary b{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--navy);background:var(--dim);border-radius:4px;text-align:center;padding:1px 0}
details.part[open] summary b{background:var(--gold)}
details.part summary small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--dim)}
details.part summary:hover{background:var(--navy-2)}
nav ol{list-style:none;padding:2px 0 8px}
nav li button{display:grid;grid-template-columns:30px 1fr 16px;gap:6px;width:100%;text-align:left;background:none;border:0;color:#c9d1df;padding:6px 20px 6px 40px;cursor:pointer;font-size:14px;line-height:1.35}
nav li button span:first-child{color:var(--dim);font-variant-numeric:tabular-nums}
nav li button:hover{background:var(--navy-2);color:var(--white)}
nav li button[aria-current="true"]{background:var(--navy-3);color:var(--white);box-shadow:inset 3px 0 0 var(--gold)}
nav li button .ck{color:var(--gold);font-size:12px}
.empty{padding:16px 24px;color:var(--dim);font-size:14px}

.scrim{display:none}
main{min-width:0;grid-column:2}
.topbar{display:none}
.wrap{max-width:800px;margin:0 auto;padding:48px 32px 90px}

/* home */
.hero{border-bottom:1px solid var(--rule);padding-bottom:30px;margin-bottom:10px}
.hero h2{font-family:var(--serif);font-size:48px;font-weight:600;line-height:1.05;letter-spacing:-.01em;color:var(--navy);margin-bottom:18px;max-width:17ch}
.hero p{font-size:17.5px;max-width:62ch;margin-bottom:12px;color:#2b3446}
.hero .exchange{margin:26px 0 6px;max-width:560px}
.sec{font-family:var(--serif);font-size:30px;font-weight:600;margin:40px 0 6px;color:var(--navy)}
.sub{color:var(--muted);max-width:62ch;margin-bottom:14px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:18px 0 8px;border:1px solid var(--rule);border-radius:10px;background:var(--white);overflow:hidden}
.steps li{padding:16px 18px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.steps li:nth-child(3n){border-right:0}
.steps li:nth-last-child(-n+3){border-bottom:0}
.steps b{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy)}
.steps b i{font-style:normal;font-family:var(--sans);font-size:13px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center}
.steps span{display:block;font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4}
.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.parts-grid button{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 14px;cursor:pointer;position:relative;overflow:hidden}
.parts-grid button::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--part)}
.parts-grid button:hover{border-color:var(--part)}
.parts-grid .pn{font-size:13px;font-weight:700;color:var(--part)}
.parts-grid strong{font-family:var(--serif);font-size:20px;line-height:1.15;color:var(--ink)}
.parts-grid .pd{font-size:14px;color:var(--muted);line-height:1.4}
.parts-grid .pc{font-size:13px;color:var(--part);font-weight:600;margin-top:auto;padding-top:6px}
.toc{columns:2 300px;column-gap:30px;margin:14px 0 30px}
.toc section{break-inside:avoid;margin-bottom:22px}
.toc h4{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:4px;color:var(--part);padding-bottom:5px;border-bottom:2px solid var(--part)}
.toc ol{list-style:none}
.toc button{display:grid;grid-template-columns:32px 1fr auto;width:100%;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;font-size:15px;color:var(--ink);gap:4px}
.toc button span:first-child{color:var(--part);font-variant-numeric:tabular-nums;font-weight:600}
.toc button:hover{color:var(--part)}
.toc .ck{color:var(--gold);font-size:13px}
.notice{background:var(--white);border:1px solid var(--rule);border-left:4px solid var(--gold);padding:18px 20px;margin:22px 0;border-radius:0 8px 8px 0}
.notice h3{font-size:16px;margin-bottom:6px}
.notice p{font-size:15px;color:var(--muted)}
.resetrow{font-size:14px;color:var(--muted);margin-top:8px}
.linkbtn{background:none;border:0;color:var(--part);text-decoration:underline;cursor:pointer;padding:0}

/* script page */
.plate{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;margin-bottom:24px}
.num{width:92px;height:92px;border-radius:12px;background:var(--part);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.num small{font-size:11.5px;font-weight:600;opacity:.8}
.num b{font-family:var(--serif);font-size:40px;line-height:1;font-weight:600}
.partname{font-size:14px;font-weight:600;color:var(--part)}
.script h2{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.1;margin:4px 0 10px;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-size:13px;border:1px solid var(--rule);background:var(--white);border-radius:999px;padding:3px 10px;color:var(--muted)}
.facts span.kind{border-color:color-mix(in srgb,var(--part) 35%,#fff);color:var(--part);background:color-mix(in srgb,var(--part) 7%,#fff);font-weight:600}

.rounds{display:grid;grid-template-columns:repeat(6,1fr);list-style:none;margin:0 0 -1px;position:relative;z-index:1}
.rounds button{width:100%;background:transparent;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;padding:10px 6px 11px;cursor:pointer;font-size:13px;line-height:1.25;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.rounds button i{font-style:normal;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--white)}
.rounds button:hover{color:var(--part)}
.rounds button.done i{background:var(--part);border-color:var(--part);color:var(--white)}
.rounds button[aria-current="step"]{background:var(--white);border-color:var(--rule);color:var(--ink);font-weight:600}
.rounds button[aria-current="step"] i{border-color:var(--part);color:var(--part);background:var(--white);box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 18%,#fff)}
.panel{background:var(--white);border:1px solid var(--rule);border-radius:0 0 12px 12px;padding:24px 26px 22px}
.panel h3{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1;margin-bottom:6px;color:var(--part)}
.panel .hint{font-size:15.5px;color:var(--muted);margin-bottom:16px;max-width:64ch}

/* player */
.deck{border:1px solid var(--rule);border-radius:10px;background:#f8f9fb;padding:14px 16px;margin-bottom:14px}
.deck-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.deck-row+.deck-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.btn{background:var(--part);color:var(--white);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{filter:brightness(.9)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:var(--white);color:var(--part);border:1px solid var(--rule)}
.btn.secondary:hover{border-color:var(--part);background:color-mix(in srgb,var(--part) 6%,#fff)}
.btn.big{padding:11px 20px;min-width:128px}
.btn.gold{background:var(--navy);color:var(--gold)}
.deck label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.deck select{border:1px solid var(--rule);border-radius:6px;padding:6px 8px;background:var(--white);max-width:210px;font-size:14px}
.deck .sp{margin-left:auto}
.nowline{font-size:14px;color:var(--muted);flex:1;min-width:180px}
.nowline b{color:var(--ink)}
.track{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:10px}
.track i{display:block;height:100%;width:0;background:var(--part);transition:width .2s}
.voice-note{font-size:13px;color:var(--muted);margin:2px 0 16px}
.recording audio{width:100%;margin-bottom:6px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);cursor:pointer}
.check input{accent-color:var(--part);width:17px;height:17px}

/* transcript as a dialogue script */
.dlg{margin-top:6px;border-top:1px solid var(--rule)}
.turn{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid #eceef2}
.who{font-size:13px;font-weight:700;padding-top:4px}
.turn.P .who{color:var(--part)}
.turn.S .who{color:#4d5a70}
.turn.S .say{background:#f3f5f8;border-radius:10px;padding:8px 12px;margin-left:-12px}
.say{font-family:var(--serif);font-size:18.5px;line-height:1.7}
.seg{border-radius:4px;transition:background .15s;cursor:pointer}
.seg:hover{background:color-mix(in srgb,var(--part) 8%,transparent)}
.seg.on{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold-soft)}
.masked{border:1px dashed #b9c1ce;border-radius:10px;padding:22px 24px;color:var(--muted);font-size:15px;background:#fafbfc}
.masked .turns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.masked .turns span{font-size:12.5px;font-weight:700;border-radius:4px;padding:3px 8px;background:var(--white);border:1px solid var(--rule)}
.masked .turns span.P{color:var(--part)}
.masked .turns span.on{background:var(--gold-soft);border-color:var(--gold)}

.field{margin-top:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field input{width:100%;max-width:360px;border:1px solid var(--rule);border-radius:8px;padding:9px 12px;background:var(--white)}
textarea{width:100%;min-height:210px;border:1px solid var(--rule);border-radius:10px;padding:14px 16px;background:var(--white);font-size:17px;line-height:1.6;resize:vertical}
textarea.short{min-height:100px}
textarea:focus,.field input:focus{border-color:var(--part);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 15%,#fff)}
.prompts{list-style:none;margin:6px 0 4px;display:grid;gap:6px}
.prompts li{font-size:15px;padding-left:18px;position:relative}
.prompts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.nextrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}

.result{margin-top:22px;border:1px solid var(--rule);border-radius:10px;padding:20px 22px;background:#fbfbfc}
.score{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;color:var(--part)}
.score small{font-family:var(--sans);font-size:15px;font-weight:400;color:var(--muted);margin-left:8px}
.legend{font-size:14px;color:var(--muted);margin:12px 0}
.legend mark,.legend del{padding:0 4px}
.diff{font-size:17px;line-height:1.9;font-family:var(--serif)}
mark{background:var(--missed);color:var(--missed-ink);border-radius:3px;padding:0 2px}
mark.small{outline:2px solid #c98a1a;outline-offset:-1px}
del{color:var(--extra);text-decoration:line-through}
.smalls{margin-top:14px;font-size:15px}
.rest{color:#9aa1a8}
.sendbox{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.sendbox p{font-size:14px;color:var(--muted);margin-top:8px}
.status{font-size:14px;color:var(--part);margin-top:8px;min-height:1.2em}
.done-banner{margin-top:16px;display:flex;gap:12px;align-items:center;background:var(--gold-soft);border:1px solid #e8d49f;border-radius:10px;padding:12px 16px;font-size:15px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:22px;border-top:1px solid var(--rule)}
.pager button{background:none;border:0;cursor:pointer;text-align:left;max-width:48%;padding:4px 0}
.pager button:last-child{text-align:right;margin-left:auto}
.pager small{display:block;font-size:13px;color:var(--muted)}
.pager span{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink)}
.pager button:hover span{color:var(--part)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  main{grid-column:1}
  aside{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);z-index:30;transform:translateX(-100%);transition:transform .2s ease}
  aside.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,18,32,.45);z-index:20;display:none}
  .scrim.open{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:var(--navy);color:var(--white);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar button{background:var(--navy-3);color:var(--white);border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
  .topbar strong{font-family:var(--serif);font-size:19px;font-weight:600}
  .wrap{padding:26px 16px 70px}
  .hero h2{font-size:36px}
  .script h2{font-size:29px}
  .plate{grid-template-columns:1fr;gap:12px}
  .num{width:70px;height:70px}.num b{font-size:30px}
  .rounds{grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
  .rounds button{border:1px solid var(--rule);border-radius:8px;background:var(--white)}
  .panel{border-radius:12px;padding:18px 16px}
  .steps{grid-template-columns:1fr}
  .steps li{border-right:0!important;border-bottom:1px solid var(--rule)!important}
  .steps li:last-child{border-bottom:0!important}
  .turn{grid-template-columns:1fr;gap:2px}
  .turn.S .say{margin-left:0}
  .say{font-size:17.5px}
  .deck .sp{margin-left:0}
}
@media (prefers-reduced-motion: reduce){aside,.track i,.seg{transition:none}}
@media print{
  aside,.topbar,.deck,.voice-note,.rounds,.pager,.nextrow,.actions,textarea,.field{display:none!important}
  .shell{display:block}.panel{border:0;padding:0}
}

.setting{font-size:15px;color:var(--muted);margin:-4px 0 10px}
.setting b{color:var(--ink);font-weight:600}
.star{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:10px;background:var(--white);overflow:hidden;margin:16px 0 10px}
.star li{padding:16px 16px 14px;border-right:1px solid var(--rule)}
.star li:last-child{border-right:0}
.star b{display:block;font-family:var(--serif);font-size:30px;line-height:1;color:var(--gold)}
.star strong{display:block;font-family:var(--serif);font-size:19px;color:var(--navy);margin-top:6px}
.star em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px}
.star span{display:block;font-size:14px;color:var(--muted);margin-top:6px;line-height:1.4}
.star li.act{background:var(--gold-soft)}
.pitfalls{list-style:none;display:grid;gap:10px;margin:14px 0 6px}
.pitfalls li{background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;font-size:15px}
.pitfalls li b{color:var(--navy)}
.formula{counter-reset:f;list-style:none;display:grid;gap:10px;margin:14px 0}
.formula li{counter-increment:f;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:15.5px}
.formula li::before{content:counter(f);width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:14px}
.coach{margin-top:18px;background:var(--gold-soft);border:1px solid #edcfb2;border-radius:10px;padding:16px 18px}
.coach h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.coach p{font-size:15.5px;color:#3a3a33}
.mine{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}
.mine h4{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--part);margin-bottom:4px}
@media (max-width:900px){.star{grid-template-columns:1fr 1fr}.star li:nth-child(2){border-right:0}.star li:nth-child(-n+2){border-bottom:1px solid var(--rule)}}
.scene{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted);margin:-2px 0 10px;max-width:62ch}
.listenfor{margin-top:18px;background:var(--gold-soft);border:1px solid #bfe0dc;border-radius:10px;padding:16px 18px}
.listenfor h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.listenfor p{font-size:15.5px;color:#2d3a38}
.listenfor p+p{margin-top:6px}
.respond{margin-top:22px}
.respond h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.rsp{border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-top:12px;background:var(--white)}
.rsit{font-size:14.5px;color:#55615f}
.rq{font-size:17px;margin:6px 0 10px}
.rsp .field{margin-bottom:10px}
.model{margin-top:10px;background:var(--gold-soft);border-radius:8px;padding:10px 12px;font-size:16px}
.model span{display:block;font-size:13.5px;color:#55615f;margin-top:4px}
.startlist{list-style:none;display:grid;gap:8px;margin:14px 0 8px}
.startlist button{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;cursor:pointer;font:inherit;color:var(--ink)}
.startlist button:hover{border-color:var(--gold)}
.startlist .n{width:32px;height:32px;border-radius:8px;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:700;font-variant-numeric:lining-nums}
.startlist b{display:block;font-family:var(--serif);font-size:18px}
.startlist small{color:var(--muted);font-size:13.5px}
.startlist .lv{font-size:12.5px;font-weight:700;color:var(--gold);text-align:right}
.startlist .ck{color:var(--gold);font-weight:700}
.cats{margin-top:20px;padding-top:14px;border-top:1px solid rgba(127,127,127,.35)}.cats h4{margin:0 0 6px;font-size:17px}.cats ol{margin:8px 0 0;padding-left:26px}.cats li{margin:4px 0;line-height:1.5}
#yourturn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:#F2C14E;color:#2a2100;padding:12px 22px 14px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.28);font-size:18px;min-width:min(320px,90vw);text-align:center}#yourturn .yt-bar{display:block;height:5px;background:rgba(0,0,0,.15);border-radius:3px;margin-top:9px;overflow:hidden}#yourturn .yt-bar i{display:block;height:100%;width:100%;background:#2a2100;animation:ytshrink linear forwards}@keyframes ytshrink{from{width:100%}to{width:0}}.rp-note{font-weight:400;opacity:.75}

le": "Un nouveau voisin", "lines": [["P", "Allô ! Tu es le nouveau voisin du troisième ?", "Stéphane"], ["S", "Oui ! Bonjour, je m'appelle Lucas. J'ai déménagé le premier juillet.", "Lucas"], ["P", "Moi, c'est Stéphane. J'habite au deuxième depuis cinq ans. Le déménagement s'est bien passé ?", "Stéphane"], ["S", "Oui, mais il faisait très chaud. Trente-deux degrés !", "Lucas"], ["P", "Classique ! Tu aimes le quartier ?", "Stéphane"], ["S", "Oui, beaucoup. Il y a des cafés, un parc et le métro est tout près.", "Lucas"], ["P", "Et le marché Jean-Talon n'est pas loin. Tu aimes cuisiner ?", "Stéphane"], ["S", "Oui, j'adore cuisiner ! Surtout des plats brésiliens.", "Lucas"], ["P", "Ah, j'aimerais goûter ça un jour ! Moi, je fais un bon barbecue.", "Stéphane"], ["S", "Super ! Qu'est-ce que tu fais dans la vie ?", "Lucas"], ["P", "Je suis infirmier à l'hôpital, pas loin d'ici. Et toi ?", "Stéphane"], ["S", "Je suis développeur informatique.", "Lucas"], ["P", "Cool. Bon, si tu as besoin d'aide pour tes boîtes, cogne à ma porte !", "Stéphane"], ["S", "Merci, Stéphane. C'est gentil !", "Lucas"]], "words": 129, "kind": "story", "scene": "A new neighbour. In July, Lucas meets his downstairs neighbour on the balcony of his new apartment.", "F": "Questions about yourself, likes", "V": "au troisième, au deuxième (on the third floor, on the second floor); le déménagement (the move); le quartier (the neighbourhood); goûter (to taste); Qu'est-ce que tu fais dans la vie ? (What do you do for a living?); un infirmier (a (male) nurse); cogner (to knock (Québec))", "t": [[1.99, 3.86], [4.08, 7.97], [8.62, 10.49], [10.7, 14.4], [14.62, 18.07], [18.72, 21.84], [22.06, 25.8], [26.02, 29.62], [30.26, 33.72], [33.94, 36.58], [37.22, 39.53], [39.74, 42.43], [43.08, 45.67], [45.89, 51.02], [51.67, 55.34], [55.56, 58.25], [58.9, 62.23], [62.45, 65.54], [66.19, 70.22], [70.44, 74.21], [74.86, 77.04], [77.26, 80.16], [80.81, 85.73], [85.94, 87.96], [88.61, 92.02], [92.66, 94.61], [94.82, 100.82], [101.47, 104.69], [104.9, 107.21]], "R": []}, {"num": 28, "title": "Les patins", "lines": [["P", "Bonjour. Je voudrais louer des patins, s'il vous plaît.", "Lucas"], ["S", "Bonjour ! Quelle pointure ?", "Le préposé"], ["P", "Je chausse du dix.", "Lucas"], ["S", "Voilà, des patins de pointure dix. Vous voulez aussi un casque ?", "Le préposé"], ["P", "Un casque ? C'est obligatoire ?", "Lucas"], ["S", "Ce n'est pas obligatoire pour les adultes, mais c'est recommandé. C'est votre première fois ?", "Le préposé"], ["P", "Oui, c'est ma première fois sur la glace.", "Lucas"], ["S", "Alors, prenez le casque ! Il est gratuit avec les patins.", "Le préposé"], ["P", "D'accord. C'est combien pour les patins ?", "Lucas"], ["S", "Dix dollars pour deux heures. Laissez vos souliers ici, dans le casier.", "Le préposé"], ["P", "Merci. Vous avez un conseil pour un débutant ?", "Lucas"], ["S", "Pliez les genoux, regardez devant vous et allez lentement. Et si vous tombez, riez !", "Le préposé"], ["P", "D'accord. Je vais sûrement rire beaucoup !", "Lucas"]], "words": 109, "kind": "story", "scene": "Skates. Lucas rents skates at an outdoor rink in a park.", "F": "Sports words, sizes, rules", "V": "louer (to rent); des patins (skates); la pointure (shoe size); un casque (a helmet); obligatoire (required); le casier (the locker); un débutant (a beginner); plier les genoux (to bend your knees); tomber (to fall)", "t": [[1.99, 4.18], [4.39, 8.66], [9.31, 11.76], [11.98, 14.5], [15.14, 17.98], [18.62, 23.45], [23.66, 26.83], [27.48, 29.52], [29.74, 32.38], [33.02, 39.22], [39.43, 42.36], [43.01, 46.99], [47.64, 51.36], [51.58, 55.13], [55.78, 57.89], [58.1, 61.01], [61.66, 65.33], [65.54, 70.39], [71.04, 73.1], [73.32, 76.75], [77.4, 83.26], [83.47, 86.98], [87.62, 89.74], [89.95, 93.17]], "R": []}, {"num": 29, "title": "Le cours de francisation", "lines": [["P", "Bonsoir, tout le monde, et bienvenue au cours de français ! Je m'appelle Isabelle Bélanger. Je suis votre professeure.", "Mme Bélanger"], ["S", "Bonsoir, madame.", "Lucas"], ["P", "Le cours a lieu le mardi et le jeudi, de dix-huit heures à vingt et une heures. Vous avez tous un cahier ?", "Mme Bélanger"], ["S", "Excusez-moi, je n'ai pas de cahier.", "Lucas"], ["P", "Ce n'est pas grave. Voici un cahier pour vous. Comment vous appelez-vous ?", "Mme Bélanger"], ["S", "Je m'appelle Lucas. Je viens du Brésil.", "Lucas"], ["P", "Bienvenue, Lucas. Alors, ce soir, nous allons nous présenter. Ensuite, nous allons écouter un dialogue.", "Mme Bélanger"], ["S", "Est-ce qu'on peut poser des questions en anglais ?", "Lucas"], ["P", "Essayez en français d'abord ! Si vous ne comprenez pas, dites simplement : Pouvez-vous répéter, s'il vous plaît ?", "Mme Bélanger"], ["S", "Pouvez-vous répéter, s'il vous plaît ?", "Lucas"], ["P", "Parfait, Lucas ! Vous voyez, c'est facile. Pour jeudi, faites les exercices de la page dix.", "Mme Bélanger"], ["S", "Les exercices de la page dix. D'accord.", "Lucas"]], "words": 133, "kind": "story", "scene": "French class. Lucas's first evening at a French class for newcomers.", "F": "Classroom words, instructions", "V": "le cours a lieu (the class takes place); un cahier (a notebook, a workbook); Ce n'est pas grave. (It's no problem.); se présenter (to introduce yourself); poser une question (to ask a question); Pouvez-vous répéter ? (Can you repeat that?); les exercices (the exercises)", "t": [[1.99, 7.49], [7.7, 11.21], [11.42, 14.76], [15.41, 18.53], [19.18, 25.56], [25.78, 28.78], [29.42, 33.22], [33.86, 36.53], [36.74, 39.82], [40.03, 42.74], [43.39, 45.96], [46.18, 49.08], [49.73, 52.99], [53.21, 58.18], [58.39, 62.78], [63.43, 67.22], [67.87, 71.28], [71.5, 78.43], [79.08, 82.66], [83.3, 86.3], [86.52, 89.98], [90.19, 95.28], [95.93, 99.46], [99.67, 101.78]], "R": []}, {"num": 30, "title": "Une invitation", "lines": [["P", "Salut, Lucas ! C'est Catherine. Tu vas bien ?", "Catherine"], ["S", "Salut, Catherine ! Oui, très bien. Et toi ?", "Lucas"], ["P", "Super ! Écoute, j'ai un nouvel appartement. Je fais une pendaison de crémaillère samedi soir. Tu veux venir ?", "Catherine"], ["S", "Une pendaison de quoi ?", "Lucas"], ["P", "Une pendaison de crémaillère. C'est une fête pour un nouvel appartement.", "Catherine"], ["S", "Ah, je comprends ! Samedi soir, oui, je suis libre. À quelle heure ?", "Lucas"], ["P", "À partir de dix-neuf heures. L'adresse, c'est le 4820, rue de la Roche.", "Catherine"], ["S", "Parfait. Qu'est-ce que je peux apporter ?", "Lucas"], ["P", "Rien de spécial. Apporte ce que tu veux boire. Ici, on dit « apportez votre vin ».", "Catherine"], ["S", "D'accord. Est-ce que je peux venir avec mon voisin, Stéphane ?", "Lucas"], ["P", "Bien sûr ! Plus on est de fous, plus on rit.", "Catherine"], ["S", "Merci pour l'invitation. Mais dimanche, je ne peux pas aller au brunch avec toi. Je travaille.", "Lucas"], ["P", "Pas de problème. À samedi, alors !", "Catherine"]], "words": 134, "kind": "story", "scene": "An invitation. Catherine calls Lucas to invite him to her housewarming party.", "F": "Inviting, accepting and declining", "V": "une pendaison de crémaillère (a housewarming party); libre (free, available); à partir de (from (a time)); apporter (to bring); Plus on est de fous, plus on rit. (The more, the merrier.); je ne peux pas (I can't)", "t": [[1.99, 4.94], [5.16, 7.63], [7.85, 9.96], [10.61, 13.7], [13.92, 16.63], [16.85, 18.72], [19.37, 21.72], [21.94, 25.94], [26.16, 30.89], [31.1, 33.62], [34.27, 36.96], [37.61, 41.06], [41.28, 45.26], [45.91, 48.6], [48.82, 53.16], [53.38, 55.63], [56.28, 59.71], [59.93, 65.66], [66.31, 68.23], [68.45, 71.3], [71.95, 74.74], [74.95, 78.36], [78.58, 82.8], [83.45, 85.56], [85.78, 90.17], [90.82, 93.14], [93.36, 97.01], [97.66, 100.73], [100.94, 106.06], [106.27, 108.55], [109.2, 111.77], [111.98, 115.15]], "R": []}]}, {"part": 2, "title": "Bridge", "desc": "NCLC 4–5 (B1). Longer conversations about work, school, a car and the first winter.", "scripts": [{"num": 31, "title": "La visite", "lines": [["P", "Bonjour, Lucas ! Entrez, entrez. Vous avez trouvé facilement ?", "Mme Gagnon"], ["S", "Oui, j'ai pris le métro jusqu'à Beaubien, puis j'ai marché cinq minutes. C'est vraiment proche.", "Lucas"], ["P", "C'est pratique, hein ? Bon, je vais vous faire visiter. Ici, c'est le salon. Il y a beaucoup de lumière le matin parce que les fenêtres donnent sur l'est.", "Mme Gagnon"], ["S", "C'est grand ! Et la cuisine ?", "Lucas"], ["P", "Par ici. Le frigo et la cuisinière sont fournis. Je les ai changés l'année passée, alors ils sont presque neufs.", "Mme Gagnon"], ["S", "Super. Et les chambres ?", "Lucas"], ["P", "La grande chambre est au fond, à côté de la salle de bain. La petite chambre est ici. Beaucoup de locataires l'utilisent comme bureau.", "Mme Gagnon"], ["S", "Ça tombe bien, je travaille souvent de la maison. Est-ce qu'il y a un balcon ?", "Lucas"], ["P", "Oui, il y a un balcon en arrière. L'été, c'est très agréable.", "Mme Gagnon"], ["S", "Et l'hiver, qui s'occupe du déneigement ?", "Lucas"], ["P", "C'est une compagnie qui déneige l'entrée et les escaliers. Vous n'avez rien à faire.", "Mme Gagnon"], ["S", "Parfait. L'appartement est disponible quand ?", "Lucas"], ["P", "Le premier juillet. Le bail est de douze mois, du premier juillet au trente juin.", "Mme Gagnon"], ["S", "D'accord. Est-ce que les animaux sont acceptés ? J'ai un petit chat.", "Lucas"], ["P", "Un chat, ça va. Les chiens, non, à cause du bruit pour les voisins d'en bas.", "Mme Gagnon"], ["S", "Je comprends. Qu'est-ce que je dois faire si je suis intéressé ?", "Lucas"], ["P", "Vous remplissez un formulaire de location, et je vais vérifier vos références. Je vais vous appeler d'ici mercredi.", "Mme Gagnon"], ["S", "Merci beaucoup, madame Gagnon. Je vais remplir le formulaire ce soir.", "Lucas"], ["P", "Parfait. Bonne fin de semaine, Lucas !", "Mme Gagnon"]], "words": 244, "kind": "story", "scene": "The visit. On Saturday, Mme Gagnon shows Lucas the apartment on rue Beaubien.", "F": "Describing a home, the lease basics", "V": "faire visiter (to show around); donner sur (to face, to look onto); fournis (supplied); un locataire (a tenant); Ça tombe bien. (That works out well.); le déneigement (snow removal); le bail (the lease); d'ici mercredi (by Wednesday)", "t": [[1.99, 4.66], [4.87, 7.42], [7.63, 10.3], [10.94, 16.15], [16.37, 18.58], [19.22, 21.5], [21.72, 24.79], [25.01, 27.55], [27.77, 32.71], [33.36, 35.23], [35.45, 37.34], [37.99, 39.86], [40.08, 43.49], [43.7, 48.43], [49.08, 50.95], [51.17, 53.04], [53.69, 58.03], [58.25, 60.91], [61.13, 64.73], [65.38, 69.12], [69.34, 71.71], [72.36, 75.82], [76.03, 79.2], [79.85, 83.11], [83.76, 88.1], [88.32, 90.96], [91.61, 93.48], [93.7, 96.48], [97.13, 99.41], [99.62, 104.06], [104.71, 106.58], [106.8, 109.54], [109.75, 111.96], [112.61, 114.98], [115.2, 119.93], [120.58, 122.45], [122.66, 125.88], [126.53, 132.07], [132.29, 135.38], [136.03, 139.22], [139.44, 142.75], [143.4, 145.27], [145.49, 148.58]], "R": []}, {"num": 32, "title": "Le jour du déménagement", "lines": [["P", "Bonjour, Lucas ! Bonne fête du Canada, et bon déménagement ! Voici vos clés : la grande, c'est pour la porte d'entrée, et la petite, c'est pour la boîte aux lettres.", "Mme Gagnon"], ["S", "Merci, madame Gagnon. Les déménageurs viennent d'arriver avec le camion.", "Lucas"], ["P", "Parfait. L'ancien locataire est parti hier soir. J'ai nettoyé l'appartement ce matin, alors tout est prêt.", "Mme Gagnon"], ["S", "Bonjour ! Je m'appelle Kevin. On commence par quoi ?", "Kevin"], ["S", "Bonjour, Kevin. Commencez par le lit et le sofa, s'il vous plaît. Le lit va dans la grande chambre, au fond à droite.", "Lucas"], ["S", "D'accord. Et les boîtes ?", "Kevin"], ["S", "Les boîtes avec un K vont dans la cuisine. Les boîtes avec un B vont dans le bureau. J'ai écrit les lettres hier soir.", "Lucas"], ["S", "Bonne idée ! Ça va aller plus vite. Attention, l'escalier est étroit. On va passer le sofa par le balcon.", "Kevin"], ["S", "Par le balcon ? Vous êtes sûr ?", "Lucas"], ["S", "Oui, on fait ça tout le temps. Le premier juillet, on a déjà fait trois déménagements avant midi !", "Kevin"], ["P", "Lucas, n'oubliez pas : les vidanges sont ramassées le jeudi, et le recyclage, le mardi. Mettez les bacs sur le trottoir la veille au soir.", "Mme Gagnon"], ["S", "Les vidanges le jeudi, le recyclage le mardi. C'est noté.", "Lucas"], ["S", "Voilà, c'est fini ! On a tout monté. Vous pouvez vérifier s'il manque quelque chose ?", "Kevin"], ["S", "Tout est là. Merci beaucoup ! Vous avez travaillé très vite.", "Lucas"], ["S", "Merci ! Bonne installation, et bon premier juillet !", "Kevin"]], "words": 221, "kind": "story", "scene": "Moving day. On July 1, Lucas moves into his new apartment with two movers.", "F": "Giving instructions, the past tense", "V": "les clés (the keys); la boîte aux lettres (the mailbox); les déménageurs (the movers); étroit (narrow); les vidanges (household garbage (Québec)); ramasser (to pick up, to collect); les bacs (the bins); monter (to carry up)", "t": [[1.99, 4.66], [4.87, 8.71], [8.93, 16.13], [16.78, 19.68], [19.9, 23.54], [24.19, 26.06], [26.28, 29.95], [30.17, 34.75], [35.4, 37.44], [37.66, 40.25], [40.46, 42.79], [43.44, 46.2], [46.42, 50.33], [50.54, 54.43], [55.08, 57.05], [57.26, 59.14], [59.78, 63.07], [63.29, 66.55], [66.77, 70.01], [70.66, 72.62], [72.84, 75.58], [75.79, 79.61], [79.82, 83.33], [83.98, 85.85], [86.06, 88.03], [88.68, 91.78], [91.99, 97.46], [98.11, 105.24], [105.46, 109.46], [110.11, 114.26], [114.48, 116.35], [117.0, 119.62], [119.83, 122.09], [122.3, 125.88], [126.53, 128.4], [128.62, 130.73], [130.94, 133.78], [134.42, 136.3], [136.51, 140.57]], "R": []}, {"num": 33, "title": "La carte de crédit", "lines": [["P", "Bonjour, monsieur Oliveira. Qu'est-ce que je peux faire pour vous aujourd'hui ?", "La conseillère"], ["S", "Bonjour. Je voudrais une carte de crédit. Mes collègues m'ont dit que c'est important pour mon historique de crédit.", "Lucas"], ["P", "Vos collègues ont raison. Au Canada, quand vous louez un appartement ou que vous achetez une voiture, on vérifie souvent votre dossier de crédit.", "La conseillère"], ["S", "Mais je n'ai pas de dossier. J'ai toujours payé comptant ou par carte de débit.", "Lucas"], ["P", "C'est normal pour un nouvel arrivant. Je vous propose une carte de crédit garantie. Vous déposez cinq cents dollars, et votre limite de crédit est de cinq cents dollars.", "La conseillère"], ["S", "Je comprends. Et si je ne paie pas tout à la fin du mois ?", "Lucas"], ["P", "Si vous ne payez pas le solde au complet, vous allez payer des intérêts. Ils sont élevés, alors je vous conseille de tout payer chaque mois.", "La conseillère"], ["S", "D'accord. Combien de temps faut-il pour avoir un bon dossier ?", "Lucas"], ["P", "En général, après six mois à un an, si vous payez toujours à temps, votre dossier sera bon. Ensuite, vous pourrez demander une carte ordinaire et récupérer votre dépôt.", "La conseillère"], ["S", "Et est-ce que je peux utiliser toute la limite ?", "Lucas"], ["P", "Vous pouvez, mais ce n'est pas une bonne idée. Essayez d'utiliser moins de la moitié de votre limite. C'est mieux pour votre dossier.", "La conseillère"], ["S", "Merci, c'est très clair. Je vais prendre la carte garantie.", "Lucas"], ["P", "Parfait. Vous allez la recevoir par la poste dans une dizaine de jours.", "La conseillère"]], "words": 232, "kind": "story", "scene": "The credit card. Lucas asks his bank adviser how to build a credit history in Canada.", "F": "Explaining a situation, conditions with si", "V": "l'historique de crédit, le dossier de crédit (credit history, credit file); payer comptant (to pay cash); une carte garantie (a secured card); déposer (to deposit); le solde au complet (the full balance); les intérêts (interest); à temps (on time); récupérer (to get back)", "t": [[1.99, 5.18], [5.4, 8.62], [9.26, 11.14], [11.35, 14.3], [14.52, 19.06], [19.7, 22.08], [22.3, 30.02], [30.67, 33.12], [33.34, 37.15], [37.8, 40.9], [41.11, 44.83], [45.05, 50.69], [51.34, 53.21], [53.42, 56.5], [57.14, 62.11], [62.33, 67.03], [67.68, 69.55], [69.77, 73.42], [74.06, 80.71], [80.93, 86.3], [86.95, 90.14], [90.79, 94.32], [94.54, 98.69], [98.9, 101.57], [102.22, 105.17], [105.38, 108.55], [109.2, 111.07], [111.29, 115.9]], "R": []}, {"num": 34, "title": "L'entrevue téléphonique", "lines": [["P", "Bonjour, est-ce que je parle à Camila Souza ?", "Mme Côté"], ["S", "Oui, c'est moi.", "Camila"], ["P", "Bonjour, madame Souza. Ici Nathalie Côté, des ressources humaines du CHSLD Rosemont. Vous avez posé votre candidature pour le poste de préposée aux bénéficiaires. Vous avez quelques minutes ?", "Mme Côté"], ["S", "Oui, bien sûr. Merci de m'appeler.", "Camila"], ["P", "Parfait. Pouvez-vous me parler de votre expérience ?", "Mme Côté"], ["S", "Je suis infirmière. J'ai travaillé six ans dans un hôpital à São Paulo, surtout avec des personnes âgées. Je suis arrivée à Montréal en janvier.", "Camila"], ["P", "Très bien. Et pourquoi ce poste vous intéresse ?", "Mme Côté"], ["S", "Je suis en train de faire les démarches pour travailler comme infirmière au Québec. En attendant, je veux travailler avec les patients et améliorer mon français.", "Camila"], ["P", "Je comprends. Le poste est de jour, de sept heures à quinze heures, mais vous devez travailler une fin de semaine sur deux. Est-ce que c'est possible pour vous ?", "Mme Côté"], ["S", "Oui, c'est possible. Je suis disponible tout de suite.", "Camila"], ["P", "Excellent. La prochaine étape, c'est une entrevue en personne avec l'infirmier-chef, monsieur Lavoie. Êtes-vous libre jeudi à dix heures ?", "Mme Côté"], ["S", "Oui, jeudi à dix heures, c'est parfait. Je dois apporter quelque chose ?", "Camila"], ["P", "Apportez votre curriculum vitae et une pièce d'identité. Je vous envoie l'adresse par courriel.", "Mme Côté"], ["S", "Merci beaucoup, madame Côté. À jeudi !", "Camila"]], "words": 200, "kind": "story", "scene": "The phone screen. A recruiter phones Camila about a job as an orderly in a long-term care home.", "F": "Describing experience, the past tense", "V": "les ressources humaines (human resources); poser sa candidature (to apply); un préposé aux bénéficiaires (an orderly, a care aide); les personnes âgées (the elderly); faire les démarches (to go through the process); en attendant (in the meantime); une fin de semaine sur deux (every other weekend)", "t": [[1.99, 5.74], [6.38, 8.26], [8.9, 11.83], [12.05, 17.23], [17.45, 23.35], [23.57, 26.18], [26.83, 28.7], [28.92, 30.79], [31.44, 33.31], [33.53, 36.91], [37.56, 39.5], [39.72, 44.71], [44.93, 47.52], [48.17, 50.04], [50.26, 53.4], [54.05, 58.1], [58.32, 62.81], [63.46, 65.42], [65.64, 72.34], [72.55, 75.22], [75.86, 77.74], [77.95, 80.09], [80.74, 82.61], [82.82, 89.09], [89.3, 92.28], [92.93, 95.78], [96.0, 98.21], [98.86, 103.37], [103.58, 106.9], [107.54, 109.97], [110.18, 112.06]], "R": []}, {"num": 35, "title": "L'entrevue d'embauche", "lines": [["P", "Bonjour, madame Souza. Assoyez-vous, je vous en prie. Vous avez trouvé facilement ?", "M. Lavoie"], ["S", "Oui, merci. Je suis venue en autobus. Ça m'a pris vingt minutes.", "Camila"], ["P", "Parfait. Alors, Mme Côté m'a dit que vous êtes infirmière au Brésil. Parlez-moi d'une journée typique dans votre ancien travail.", "M. Lavoie"], ["S", "Je travaillais dans une unité de gériatrie. Le matin, je donnais les médicaments et je vérifiais les signes vitaux. J'aidais aussi les patients à se lever, à se laver et à manger.", "Camila"], ["P", "Ici, le travail de préposée, c'est surtout les soins de base : l'hygiène, les repas, les déplacements. Vous n'allez pas donner de médicaments. Est-ce que ça vous convient ?", "M. Lavoie"], ["S", "Oui, tout à fait. Je sais que c'est un autre rôle. Pour moi, le plus important, c'est le contact avec les résidents.", "Camila"], ["P", "Quelle est votre plus grande qualité ?", "M. Lavoie"], ["S", "Je suis patiente et calme. Avec les personnes âgées, c'est essentiel. Une fois, une patiente avait peur de prendre sa douche. J'ai pris le temps de lui parler, et elle a accepté.", "Camila"], ["P", "C'est un bel exemple. Et votre français ? Les résidents parlent seulement français, souvent avec un fort accent.", "M. Lavoie"], ["S", "Je suis des cours de français trois soirs par semaine. Je comprends bien, mais parfois je dois demander de répéter.", "Camila"], ["P", "C'est normal. Avez-vous des questions pour moi ?", "M. Lavoie"], ["S", "Oui. Est-ce qu'il y a une formation au début ?", "Camila"], ["P", "Oui, deux semaines de formation, avec une préposée expérimentée. On vous rappelle d'ici lundi.", "M. Lavoie"], ["S", "Merci beaucoup pour votre temps, monsieur Lavoie.", "Camila"]], "words": 237, "kind": "story", "scene": "The job interview. Camila meets the head nurse at the long-term care home.", "F": "Strengths, past experience, questions to ask", "V": "Assoyez-vous. (Have a seat. (Québec)); les signes vitaux (vital signs); les soins de base (basic care); Ça vous convient ? (Does that suit you?); une qualité (a strength); suivre des cours (to take classes); une formation (training)", "t": [[1.99, 5.42], [5.64, 8.98], [9.19, 11.76], [12.41, 14.28], [14.5, 16.56], [16.78, 18.82], [19.46, 21.34], [21.55, 27.41], [27.62, 32.3], [32.95, 35.9], [36.12, 40.58], [40.8, 44.86], [45.5, 54.7], [54.91, 58.18], [58.39, 60.79], [61.44, 63.31], [63.53, 65.66], [65.88, 69.94], [70.58, 73.42], [74.06, 76.08], [76.3, 79.3], [79.51, 82.97], [83.18, 86.45], [87.1, 89.71], [89.93, 92.02], [92.23, 97.9], [98.54, 101.62], [101.83, 105.58], [106.22, 108.5], [108.72, 111.46], [112.1, 112.75], [112.97, 115.32], [115.97, 122.09], [122.3, 125.38], [126.02, 128.98]], "R": []}, {"num": 36, "title": "La visite du CHSLD", "lines": [["P", "Bonjour, Camila ! Je suis Josée. Je vais te former pendant deux semaines. On se tutoie, ça te va ?", "Josée"], ["S", "Oui, bien sûr ! Enchantée, Josée. Je suis un peu nerveuse.", "Camila"], ["P", "C'est normal, la première journée. Viens, je vais te faire visiter. D'abord, voici le vestiaire. Ton casier, c'est le numéro quarante-deux. Ton uniforme est déjà dedans.", "Josée"], ["S", "Parfait. Et mon badge ?", "Camila"], ["P", "Tu vas le recevoir cet après-midi aux ressources humaines. En attendant, tu restes avec moi, parce que les portes s'ouvrent seulement avec le badge.", "Josée"], ["S", "D'accord.", "Camila"], ["P", "Ici, au deuxième étage, il y a trente-deux résidents. Le poste des infirmières est au milieu du corridor. Si tu as un problème, tu vas là. La salle à manger est au bout, à gauche.", "Josée"], ["S", "Les repas sont à quelle heure ?", "Camila"], ["P", "Le déjeuner est à huit heures, le dîner à midi et le souper à dix-sept heures. On aide les résidents à venir à la salle à manger, et certains mangent dans leur chambre.", "Josée"], ["S", "Le déjeuner, c'est le repas du matin, c'est ça ? Au cours de français, on a appris « petit-déjeuner ».", "Camila"], ["P", "Oui ! Au Québec, on dit le déjeuner, le dîner et le souper. Tu vas t'habituer vite. Autre chose importante : on se lave les mains en entrant et en sortant de chaque chambre. Toujours.", "Josée"], ["S", "Compris. Et la pause ?", "Camila"], ["P", "Tu as quinze minutes à dix heures et trente minutes pour dîner. La salle des employés est à côté de l'ascenseur. Bon, on va rencontrer madame Pelletier. Elle a quatre-vingt-quatorze ans, et elle adore les visiteurs !", "Josée"]], "words": 247, "kind": "story", "scene": "The tour of the care home. On her first day, a colleague shows Camila around the long-term care home.", "F": "Workplace vocabulary, rules and routines", "V": "former (to train); le vestiaire (the locker room); dedans (inside); le poste des infirmières (the nursing station); le déjeuner, le dîner, le souper (breakfast, lunch, supper (Québec)); s'habituer (to get used to); l'ascenseur (the elevator)", "t": [[1.99, 4.68], [4.9, 6.98], [7.2, 10.27], [10.49, 13.22], [13.87, 15.74], [15.96, 18.24], [18.46, 20.4], [21.05, 24.34], [24.55, 27.6], [27.82, 31.08], [31.3, 34.92], [35.14, 37.94], [38.59, 40.46], [40.68, 42.55], [43.2, 47.4], [47.62, 53.83], [54.48, 56.35], [57.0, 61.42], [61.63, 65.83], [66.05, 69.34], [69.55, 73.1], [73.75, 75.67], [76.32, 81.72], [81.94, 87.74], [88.39, 91.66], [91.87, 95.66], [96.31, 98.18], [98.4, 103.15], [103.37, 105.84], [106.06, 111.96], [112.18, 114.05], [114.7, 116.57], [116.78, 118.66], [119.3, 123.43], [123.65, 127.68], [127.9, 131.42], [131.64, 136.15]], "R": []}, {"num": 37, "title": "La réunion du lundi", "lines": [["P", "Bon matin, tout le monde ! On commence. Cette semaine, on a une grosse semaine, parce que le client viendra vendredi pour voir la nouvelle version de l'application.", "Marc"], ["S", "Vendredi à quelle heure ?", "Élodie"], ["P", "À dix heures. Élodie, tu prépareras la présentation. Tu pourras me l'envoyer jeudi midi ?", "Marc"], ["S", "Oui, pas de problème. J'aurai besoin des captures d'écran de Lucas.", "Élodie"], ["P", "Justement. Lucas, tu termineras la page de connexion d'ici mercredi. Ensuite, tu feras les captures d'écran pour Élodie.", "Marc"], ["S", "D'accord. Mais j'ai une question. Le client veut toujours la connexion avec le numéro de téléphone ?", "Lucas"], ["P", "Bonne question. Je l'appellerai ce matin et je te répondrai avant midi.", "Marc"], ["S", "Et moi, Marc ?", "François"], ["P", "François, tu corrigeras les bogues de la semaine dernière. Il en reste combien ?", "Marc"], ["S", "Il en reste six. Deux sont urgents.", "François"], ["P", "Alors, commence par les deux urgents. Si tu as besoin d'aide, Lucas pourra t'aider jeudi.", "Marc"], ["S", "Oui, jeudi après-midi, je serai libre.", "Lucas"], ["P", "Parfait. Une dernière chose : mercredi, il y aura une coupure d'électricité dans l'immeuble entre midi et treize heures. Sauvegardez votre travail avant midi.", "Marc"], ["S", "On pourra dîner ensemble au restaurant, alors !", "Élodie"], ["P", "Bonne idée. Merci, tout le monde. Bonne semaine !", "Marc"]], "words": 184, "kind": "story", "scene": "The Monday meeting. At the weekly team meeting, Marc gives out the tasks for the week.", "F": "The future tense, deadlines", "V": "Bon matin ! (Good morning! (Québec)); la version (the version); des captures d'écran (screenshots); justement (exactly, as it happens); la page de connexion (the login page); les bogues (bugs (Québec)); Il en reste six. (There are six left.); une coupure d'électricité (a power outage); sauvegarder (to save)", "t": [[1.99, 5.02], [5.23, 7.37], [7.58, 16.85], [17.5, 20.04], [20.69, 22.87], [23.09, 27.14], [27.36, 30.5], [31.15, 33.74], [33.96, 37.51], [38.16, 40.13], [40.34, 45.91], [46.13, 50.95], [51.6, 53.47], [53.69, 56.02], [56.23, 60.43], [61.08, 63.34], [63.55, 68.42], [69.07, 71.45], [72.1, 77.35], [77.57, 79.94], [80.59, 83.02], [83.23, 85.42], [86.06, 89.95], [90.17, 95.16], [95.81, 99.72], [100.37, 102.24], [102.46, 111.65], [111.86, 115.66], [116.3, 120.29], [120.94, 122.98], [123.19, 126.26], [126.48, 128.76]], "R": []}, {"num": 38, "title": "La pause café", "lines": [["P", "Salut, Lucas ! Pis, ta fin de semaine ? T'as fait quelque chose de spécial ?", "François"], ["S", "Oui, je suis allé au Festival de jazz avec mon voisin. Il y avait beaucoup de monde, mais c'était super.", "Lucas"], ["S", "Ah, j'adore le Festival de jazz ! Les spectacles gratuits dehors, c'est ce que je préfère à Montréal en été.", "Élodie"], ["P", "Moi, je trouve qu'il y a trop de monde. Je préfère les petits festivals, dans les quartiers.", "François"], ["S", "Tu as raison, c'était un peu difficile de bouger. Mais la musique était excellente. Il y avait même un groupe brésilien !", "Lucas"], ["S", "Ça t'a rappelé ton pays ?", "Élodie"], ["S", "Oui, un peu. J'ai eu un petit coup de nostalgie. Et toi, Élodie, ta fin de semaine ?", "Lucas"], ["S", "Tranquille. On est allés à la piscine avec les enfants. Il faisait trente-trois degrés avec l'humidité !", "Élodie"], ["P", "C'est fou, hein ? L'hiver, il fait moins trente, is"], ["S", "La rondelle ? C'est le petit disque noir ?", "Lucas"], ["P", "Exactement. Un match, c'est trois périodes de vingt minutes. Si c'est égal à la fin, il y a une prolongation.", "François"], ["S", "Et pourquoi tout le monde parle du match contre Toronto ?", "Lucas"], ["P", "C'est la grande rivalité ! Montréal contre Toronto, c'est comme Flamengo contre Fluminense chez vous, j'imagine.", "François"], ["S", "Ah, je comprends maintenant ! Alors, c'est très important.", "Lucas"], ["P", "Très, très important. Regarde, le match commence. Le numéro quatorze, c'est notre meilleur joueur.", "François"], ["S", "Oh ! Il a marqué un but ? Pourquoi tout le monde crie ?", "Lucas"], ["P", "Oui, il a compté ! Un à zéro pour le Canadien ! Allez, Montréal !", "François"], ["S", "Et maintenant, pourquoi le joueur de Toronto va dans la petite boîte ?", "Lucas"], ["P", "C'est le banc des pénalités. Il a fait trébucher notre joueur, alors il doit rester là deux minutes.", "François"], ["S", "J'aime ça ! C'est rapide, et l'ambiance est incroyable. Je pense que je vais devenir un fan du Canadien.", "Lucas"]], "words": 209, "kind": "story", "scene": "The Canadiens game. François invites Lucas to watch a hockey game at a sports bar.", "F": "Sports talk, enthusiasm, explaining rules", "V": "avouer (to admit); les règles (the rules); la rondelle (the puck (Québec)); le filet (the net); une prolongation (overtime); marquer un but, compter (to score a goal (compter: Québec)); le banc des pénalités (the penalty box); faire trébucher (to trip)", "t": [[1.99, 7.15], [7.37, 10.75], [11.4, 13.51], [13.73, 18.96], [19.61, 22.92], [23.14, 30.46], [31.1, 32.98], [33.19, 35.83], [36.48, 38.5], [38.71, 42.6], [42.82, 47.09], [47.74, 51.55], [52.2, 54.77], [54.98, 61.8], [62.45, 65.09], [65.3, 68.23], [68.88, 71.42], [71.64, 74.93], [75.14, 79.37], [80.02, 81.89], [82.1, 84.31], [84.53, 86.9], [87.55, 90.02], [90.24, 93.05], [93.26, 95.78], [96.43, 101.04], [101.69, 104.33], [104.54, 109.75], [110     a.addEventListener("loadedmetadata", () => done(true), { once: true });

const MALE = /\bmale\b|alex|aaron|evan|nathan|tom|daniel|oliver|arthur|lee|gordon|rishi|guy|christopher|eric|andrew|brian|roger|ryan|liam|william|david|mark|matthew|james|thomas|noah|jamie/i;
const GOOD = /samantha|alex|ava|zoe|allison|susan|evan|nathan|tom|daniel|karen|moira|tessa|serena|kate|oliver|arthur|jenny|aria|guy|libby|sonia|ryan|clara|liam|natural|neural|google/i;

      <div class="field"><label for="mineTxt">My notes (saved in this browser)</label><textarea id="mineTxt" class="short">${esc(store.get("mine:" + s.num, ""))}</textarea></div>
    </div><div class="respond"><h4>Respond</h4><p class="hint">Now it's your turn. Read the situation, say your answer out loud, and write it if you like. Then compare it with the model answer.</p>
      ${(s.R || []).map((r, i) => `<div class="rsp"><p class="rsit">${esc(r[0])}</p><p class="rq"><b>${esc(r[1])}:</b> “${esc(r[2])}”</p><div class="field"><label for="rsp${i}">Your answer (saved in this browser)</label><textarea id="rsp${i}" class="short" data-rsp="${i}">${esc(store.get(`rsp:${s.num}:${i}`, ""))}</textarea></div><button class="btn secondary" data-model="${i}">Show a model answer</button><p class="model" id="model${i}" hidden><b>Model answer:</b> ${esc(r[3])}<span>Your answer doesn't have to match. Any natural, polite reply that fits the situation is good.</span></p></div>`).join("")}
    </div>${nextRow(k)}`;
  if ($("#mineTxt")) $("#mineTxt").oninput = e => store.set("mine:" + s.num, e.target.value);
  P.querySelectorAll("[data-rsp]").forEach(t => t.oninput = e => store.set(`rsp:${ST.num}:${t.dataset.rsp}`, e.target.value));
  P.querySelectorAll("[data-model]").forEach(b => b.onclick = () => { const m = $("#model" + b.dataset.model); m.hidden = !m.hidden; b.textContent = m.hidden ? "Show a model answer" : "Hide the model answer"; });
  if (k !== 3) wirePlayer(s, { echo: k === 5, tapOne: k === 5 });
  P.querySelectorAll("[data-go]").forEach(b => b.onclick = () => goRound(+b.dataset.go));
  if ($("#finish")) $("#finish").onclick = () => { ST.done.add(5); markDone(ST.num); renderScript(ST.num); renderNav($("#q").value); };
  if (k === 3) { $("#check").onclick = () => { saveFields(); check(s); }; if (ST.result) showResult(s); }
}

/* ---------- transcription check ---------- */
const norm = w => w.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9'àâäéèêëîïôöùûüÿçœæãõáíóú½%]/g, "").replace(/^'+|'+$/g, "");
function tokens(t) { return t.replace(/[“”]/g, '"').replace(/—|–/g, " ").split(/\s+/).filter(Boolean).map(w => ({ raw: w, n: norm(w) })).filter(x => x.n); }
function check(s) {
  const FULL = tokens(fullText(s)), B = tokens(ST.answer);
  if (!B.length) { $("#result").innerHTML = `<div class="result"><p>Your transcription is empty. Go back to round 2, write what you hear, and then check it here.</p></div>`; return; }
  const reach = Math.min(FULL.length, Math.round(B.length * 1.6) + 15);
  const A = FULL.slice(0, reach), tail = FULL.slice(reach), n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i].n === B[j].n ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && A[i].n === B[j].n) { ops.push(["same", i]); i++; j++; }
    else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { ops.push(["extra", j]); j++; }
    else { ops.push(["miss", i]); i++; }
  }
  const hits = ops.filter(o => o[0] === "same").map(o => o[1]);
  while (hits.length > 1 && hits[hits.length - 1] - hits[hits.length - 2] > 8) hits.pop();
  const lastA = hits.length ? hits[hits.length - 1] : -1;
  if (lastA < 0) { ST.result = { empty: true }; showResult(s); return; }
  let out = [], matched = 0, graded = 0, small = new Map(), other = [], extra = [], rest = [];
  ops.forEach(([kd, x]) => {
    if (kd === "same" && x <= lastA) { out.push(esc(A[x].raw)); matched++; graded++; }
    else if (kd === "same") rest.push(esc(A[x].raw));
    else if (kd === "extra") { if (!rest.length) { out.push(`<del>${esc(B[x].raw)}</del>`); extra.push(B[x].n); } }
    else if (x > lastA) rest.push(esc(A[x].raw));
    else { graded++; const w = A[x].n, sm = SMALL.has(w); if (sm) small.set(w, (small.get(w) || 0) + 1); else other.push(w); out.push(`<mark class="${sm ? "small" : ""}">${esc(A[x].raw)}</mark>`); }
  });
  tail.forEach(w => rest.push(esc(w.raw)));
  ST.result = { out, rest, matched, graded, small: [...small].sort((a, b) => b[1] - a[1]), other, extra };
  ST.done.add(3); showResult(s);
}
function showResult(s) {
  const R = ST.result, box = $("#result"); if (!box) return;
  if (R.empty) { box.innerHTML = `<div class="result"><p>None of your words matched the text yet. Listen again from the beginning and try the first few sentences.</p></div>`; return; }
  const pct = Math.floor(R.matched / R.graded * 100), partial = R.rest.length > 0;
  const smallList = R.small.map(([w, c]) => c > 1 ? `${esc(w)} (${c})` : esc(w)).join(", ");
  const acad = [...new Set(R.other.filter(w => w.length > 7))].slice(0, 20);
  box.innerHTML = `<div class="result">
    <p class="score">${pct}%<small>${R.matched} of ${R.graded} words correct${partial ? ", checked up to where you stopped" : ""}</small></p>
    <p class="legend"><mark>missed</mark> <mark class="small">missed small word</mark> <del>extra or misspelled</del>${partial ? ` <span class="rest">not transcribed yet</span>` : ""}</p>
    <div class="diff">${R.out.join(" ")}${partial ? ` <span class="rest">${R.rest.join(" ")}</span>` : ""}</div>
    ${smallList ? `<p class="smalls"><b>Small words you missed:</b> ${smallList}</p>` : `<p class="smalls">You didn't miss any small words. Well done.</p>`}
    ${acad.length ? `<p class="smalls"><b>Longer words to review:</b> ${acad.map(esc).join(", ")}</p>` : ""}
    <div class="sendbox">
      <div class="field"><label for="sname">Your name</label><input id="sname" value="${esc(ST.name || "")}" autocomplete="name"></div>
      <div class="actions"><button class="btn" id="copy">Copy my results</button></div>
      <p>Copy your results and send them to your French teacher.</p>
      <p class="status" id="status" role="status"></p>
    </div></div>`;
  $("#sname").oninput = e => { ST.name = e.target.value; store.set("name", ST.name); };
  $("#copy").onclick = async () => {
    const t = resultText(s);
    try { await navigator.clipboard.writeText(t); } catch { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    $("#status").textContent = "Copied. Paste it into a message to your teacher.";
  };
}
function resultText(s) {
  const R = ST.result, pct = Math.floor(R.matched / R.graded * 100);
  const cap = (a, k) => a.length > k ? a.slice(0, k).join(", ") + ` (and ${a.length - k} more)` : a.join(", ") || "none";
  const lines = ["Listening Lab results", `Name: ${ST.name || "(not given)"}`, `Story: ${s.num}. ${s.title} (Tier ${s.part}: ${s.partTitle})`,
    `Score: ${pct}% (${R.matched} of ${R.graded} words${R.rest.length ? ", checked up to where I stopped" : ""})`, "",
    `Small words I missed: ${cap(R.small.map(([w, c]) => c > 1 ? `${w} (${c})` : w), 30)}`,
    `Other words I missed: ${cap(R.other, 40)}`, `Extra or misspelled words I wrote: ${cap(R.extra, 30)}`];
  if (ST.gist) lines.push("", `My answers after the first listen: ${ST.gist.slice(0, 500)}`);
  return lines.join("\n");
}

/* ---------- routing ---------- */
function route() {
  const h = location.hash;
  if (h.startsWith("#script-")) renderScript(+h.slice(8)); else renderHome();
  renderNav($("#q").value); closeMenu();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-script],[data-home]"); if (!b) return;
  location.hash = b.hasAttribute("data-home") ? "#home" : "#script-" + b.dataset.script;
});
$("#q").addEventListener("input", e => renderNav(e.target.value));
function closeMenu() { $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false"); }
$("#menuBtn").onclick = () => { $("#sidebar").classList.add("open"); $("#scrim").classList.add("open"); $("#menuBtn").setAttribute("aria-expanded", "true"); };
$("#scrim").onclick = closeMenu;
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeMenu(); stopAll(); } });
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", () => { if ("speechSynthesis" in window) speechSynthesis.cancel(); });
renderProgress();
route();
</script>
</body>
</html>
